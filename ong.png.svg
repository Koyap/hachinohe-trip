<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#2d4a3e"/>

  <!-- Radial glow effects -->
  <ellipse cx="240" cy="315" rx="420" ry="300" fill="rgba(74,124,89,0.32)"/>
  <ellipse cx="960" cy="180" rx="320" ry="240" fill="rgba(122,171,138,0.18)"/>

  <!-- Decorative circles -->
  <circle cx="1120" cy="520" r="260" fill="none" stroke="rgba(184,212,192,0.08)" stroke-width="60"/>
  <circle cx="80"   cy="80"  r="180" fill="none" stroke="rgba(184,212,192,0.06)" stroke-width="50"/>

  <!-- Horizontal accent line -->
  <rect x="80" y="310" width="120" height="2" rx="1" fill="rgba(184,212,192,0.45)"/>

  <!-- Main title -->
  <text x="80" y="260"
    font-family="'Noto Serif JP', 'Hiragino Mincho ProN', serif"
    font-size="96"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="4">広報会 in八戸</text>

  <!-- Subtitle -->
  <text x="82" y="360"
    font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif"
    font-size="36"
    font-weight="300"
    fill="#b8d4c0"
    letter-spacing="3">青森の自然と食と酒を楽しむ3日間</text>

  <!-- Date pill -->
  <rect x="82" y="406" width="400" height="56" rx="28"
    fill="rgba(255,255,255,0.10)"
    stroke="rgba(184,212,192,0.40)"
    stroke-width="1.5"/>
  <text x="282" y="440"
    font-family="'Noto Sans JP', sans-serif"
    font-size="26"
    font-weight="500"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="2">📅 4/17（金）〜 4/19（日）</text>

  <!-- Members pill -->
  <rect x="500" y="406" width="200" height="56" rx="28"
    fill="rgba(255,255,255,0.10)"
    stroke="rgba(184,212,192,0.40)"
    stroke-width="1.5"/>
  <text x="600" y="440"
    font-family="'Noto Sans JP', sans-serif"
    font-size="26"
    font-weight="500"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="2">👥 7名</text>

  <!-- Shinkansen emoji area -->
  <text x="920" y="420"
    font-size="160"
    text-anchor="middle">🚅</text>

  <!-- Bottom tag line -->
  <text x="80" y="570"
    font-family="'Noto Sans JP', sans-serif"
    font-size="22"
    font-weight="300"
    fill="rgba(184,212,192,0.6)"
    letter-spacing="4">KOHOKAI TRIP 2025</text>
</svg>
