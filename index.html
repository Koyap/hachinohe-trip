<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a2e"/>
      <stop offset="100%" stop-color="#2d4a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0"    y1="210" x2="1200" y2="210"/>
    <line x1="0"    y1="420" x2="1200" y2="420"/>
    <line x1="400"  y1="0"   x2="400"  y2="630"/>
    <line x1="800"  y1="0"   x2="800"  y2="630"/>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#accent)" opacity="0.7"/>

  <!-- Left color accent block -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>

  <!-- Circle decoration top-right -->
  <circle cx="1080" cy="120" r="200" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="60"/>
  <circle cx="1080" cy="120" r="100" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="30"/>

  <!-- Circle decoration bottom-left -->
  <circle cx="120"  cy="520" r="160" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="50"/>

  <!-- Horizontal divider line with gradient -->
  <rect x="80" y="390" width="500" height="2" fill="url(#accent)" opacity="0.6"/>

  <!-- Main title -->
  <text
    x="80" y="280"
    font-family="'Hiragino Mincho ProN','Noto Serif JP',serif"
    font-size="100"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="4">広報会 in八戸</text>

  <!-- Year -->
  <text
    x="82" y="360"
    font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif"
    font-size="36"
    font-weight="300"
    fill="rgba(255,255,255,0.55)"
    letter-spacing="8">2026</text>

  <!-- Date pill -->
  <rect x="80" y="416" width="310" height="52" rx="26"
    fill="rgba(255,255,255,0.08)"
    stroke="rgba(255,255,255,0.18)"
    stroke-width="1"/>
  <text
    x="235" y="449"
    font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif"
    font-size="24"
    font-weight="400"
    fill="rgba(255,255,255,0.85)"
    text-anchor="middle"
    letter-spacing="2">4/17（金）〜 4/19（日）</text>

  <!-- Members pill -->
  <rect x="406" y="416" width="150" height="52" rx="26"
    fill="rgba(255,255,255,0.08)"
    stroke="rgba(255,255,255,0.18)"
    stroke-width="1"/>
  <text
    x="481" y="449"
    font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif"
    font-size="24"
    font-weight="400"
    fill="rgba(255,255,255,0.85)"
    text-anchor="middle"
    letter-spacing="2">7名</text>

  <!-- Shinkansen icon (simplified geometric) -->
  <g transform="translate(760, 240)">
    <!-- body -->
    <rect x="0"   y="30" width="340" height="60" rx="6" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <!-- nose -->
    <path d="M340,30 Q390,30 410,45 Q425,55 425,60 Q425,68 410,75 Q390,90 340,90 Z"
      fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <!-- top stripe -->
    <rect x="0" y="30" width="420" height="8" rx="3" fill="rgba(74,222,128,0.6)"/>
    <!-- windows -->
    <rect x="20"  y="44" width="38" height="22" rx="4" fill="rgba(56,189,248,0.4)"/>
    <rect x="72"  y="44" width="38" height="22" rx="4" fill="rgba(56,189,248,0.4)"/>
    <rect x="124" y="44" width="38" height="22" rx="4" fill="rgba(56,189,248,0.4)"/>
    <rect x="176" y="44" width="38" height="22" rx="4" fill="rgba(56,189,248,0.4)"/>
    <rect x="228" y="44" width="38" height="22" rx="4" fill="rgba(56,189,248,0.4)"/>
    <rect x="280" y="44" width="38" height="22" rx="4" fill="rgba(56,189,248,0.4)"/>
    <!-- nose window -->
    <ellipse cx="383" cy="60" rx="18" ry="12" fill="rgba(56,189,248,0.4)"/>
    <!-- rail -->
    <rect x="-40" y="94" width="500" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  </g>
</svg>
